<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Brew & Bean</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery & jQuery Validation Library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
</head>
<body>

    <main class="container">

        <section class="intro">
            <div class="logo">BREW & BEAN</div>

            <div class="intro-text">
                <p class="small-title">WELCOME BACK</p>
                <h1>Your favorite coffee is waiting.</h1>
                <p>
                    Log in to your account to order, customize your drinks, and track your loyalty points.
                </p>
            </div>
        </section>

        <section class="form-area">

            <div class="form-card">

                <div class="form-header">
                    <span class="coffee-icon">☕</span>
                    <h2>Sign In</h2>
                    <p>Welcome back! Please enter your details.</p>
                </div>

                <div id="alertMessage" class="alert-message"></div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            placeholder="Enter your username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                        >
                    </div>

                    <div class="form-options">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit">Login</button>

                </form>

                <p class="switch-text">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

            </div>

        </section>

    </main>

    <script>
        $(document).ready(function() {
            $('#loginForm').validate({
                rules: {
                    username: { required: true },
                    password: { required: true }
                },
                messages: {
                    username: { required: "Please enter your username." },
                    password: { required: "Please enter your password." }
                },
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                submitHandler: function(form) {
                    const alertMessage = $('#alertMessage');
                    const username = $('#loginUsername').val().trim();
                    const password = $('#loginPassword').val().trim();

                    // 1. Static Admin Login Check
                    if (username === 'admin' && password === '12345') {
                        localStorage.setItem('currentUser', JSON.stringify({ username: username, role: 'admin' }));
                        
                        alertMessage.text('Admin login successful! Loading dashboard...')
                            .attr('class', 'alert-message alert-success')
                            .show();

                        setTimeout(function() {
                            window.location.href = 'admin.html';
                        }, 1000);

                    } else {
                        // 2. Regular Registered Users Check
                        const users = JSON.parse(localStorage.getItem('users')) || [];
                        const foundUser = users.find(u => u.username === username && u.password === password);

                        if (foundUser) {
                            localStorage.setItem('currentUser', JSON.stringify(foundUser));
                            
                            alertMessage.text('Login successful! Loading menu...')
                                .attr('class', 'alert-message alert-success')
                                .show();

                            setTimeout(function() {
                                window.location.href = 'index.html';
                            }, 1000);
                        } else {
                            alertMessage.text('Invalid username or password!')
                                .attr('class', 'alert-message alert-error')
                                .show();
                        }
                    }
                }
            });
        });
    </script>

</body>
</html>

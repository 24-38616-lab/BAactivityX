<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Brew & Bean</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery & jQuery Validation Library -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
</head>
<body>

    <main class="container">

        <section class="intro">
            <div class="logo">BREW & BEAN</div>

            <div class="intro-text">
                <p class="small-title">JOIN THE CLUB</p>
                <h1>Start your coffee journey with us.</h1>
                <p>
                    Create an account to order your favorite artisanal brews, 
                    track purchases, and get exclusive member rewards.
                </p>
            </div>
        </section>

        <section class="form-area">

            <div class="form-card">

                <div class="form-header">
                    <span class="coffee-icon">☕</span>
                    <h2>Create Account</h2>
                    <p>Enter your details to register.</p>
                </div>

                <div id="alertMessage" class="alert-message"></div>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="regUsername">Username</label>
                        <input
                            type="text"
                            id="regUsername"
                            name="username"
                            placeholder="Enter your username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input
                            type="email"
                            id="regEmail"
                            name="email"
                            placeholder="Enter your email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input
                            type="password"
                            id="regPassword"
                            name="password"
                            placeholder="Create a password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="regConfirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                        >
                    </div>

                    <button type="submit" id="regBtn">Register</button>

                </form>

                <p class="switch-text">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>

        </section>

    </main>

    <script>
        $(document).ready(function() {
            $('#registerForm').validate({
                rules: {
                    username: { required: true, minlength: 3 },
                    email: { required: true, email: true },
                    password: { required: true, minlength: 5 },
                    confirmPassword: { required: true, equalTo: "#regPassword" }
                },
                messages: {
                    username: { required: "Please enter a username.", minlength: "At least 3 characters required." },
                    email: { required: "Please enter an email.", email: "Enter a valid email address." },
                    password: { required: "Please create a password.", minlength: "At least 5 characters required." },
                    confirmPassword: { required: "Please confirm password.", equalTo: "Passwords do not match!" }
                },
                errorPlacement: function(error, element) {
                    error.insertAfter(element);
                },
                submitHandler: function(form) {
                    const alertMessage = $('#alertMessage');
                    const regBtn = $('#regBtn');

                    const username = $('#regUsername').val().trim();
                    const email = $('#regEmail').val().trim();
                    const password = $('#regPassword').val().trim();

                    const users = JSON.parse(localStorage.getItem('users')) || [];
                    const userExists = users.some(u => u.username === username || u.email === email);

                    if (userExists) {
                        alertMessage.text('Username or Email is already taken!')
                            .attr('class', 'alert-message alert-error')
                            .show();
                    } else {
                        users.push({ username, email, password });
                        localStorage.setItem('users', JSON.stringify(users));

                        alertMessage.text('Registration successful! Redirecting to login page...')
                            .attr('class', 'alert-message alert-success')
                            .show();

                        regBtn.prop('disabled', true);

                        setTimeout(function() {
                            window.location.href = 'login.html';
                        }, 1500);
                    }
                }
            });
        });
    </script>

</body>
</html>
